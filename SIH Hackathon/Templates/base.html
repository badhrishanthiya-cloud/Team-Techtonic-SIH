<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAG &amp; FIND — NITK Lost &amp; Found</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="url_for("")" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 900:'#0a0a0a', 800:'#141414', 700:'#1f1f1f', 600:'#2a2a2a', 500:'#3a3a3a', 400:'#525252' },
            lost: { 50:'#fef2f2',100:'#fee2e2',200:'#fecaca',300:'#fca5a5',400:'#f87171',500:'#ef4444',600:'#dc2626',700:'#b91c1c',800:'#991b1b',900:'#7f1d1d' },
            found: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d' },
          },
          fontFamily: { sans:['Inter','system-ui','sans-serif'], display:['Poppins','system-ui','sans-serif'] },
          animation: {
            'fade-in':'fadeIn .5s ease-out','slide-up':'slideUp .4s ease-out','slide-down':'slideDown .4s ease-out',
            'scale-in':'scaleIn .3s ease-out','bounce-in':'bounceIn .6s cubic-bezier(.68,-.55,.265,1.55)',
            'toast-in':'toastIn .3s ease-out','spin-slow':'spin 3s linear infinite',
          },
          keyframes: {
            fadeIn:{'0%':{opacity:0},'100%':{opacity:1}},
            slideUp:{'0%':{opacity:0,transform:'translateY(20px)'},'100%':{opacity:1,transform:'translateY(0)'}},
            slideDown:{'0%':{opacity:0,transform:'translateY(-20px)'},'100%':{opacity:1,transform:'translateY(0)'}},
            scaleIn:{'0%':{opacity:0,transform:'scale(.9)'},'100%':{opacity:1,transform:'scale(1)'}},
            bounceIn:{'0%':{opacity:0,transform:'scale(.3)'},'50%':{opacity:1,transform:'scale(1.05)'},'70%':{transform:'scale(.9)'},'100%':{transform:'scale(1)'}},
            toastIn:{'0%':{opacity:0,transform:'translateY(-100%) translateX(-50%)'},'100%':{opacity:1,transform:'translateY(0) translateX(-50%)'}},
          },
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-grid { background-image: linear-gradient(rgba(251,191,36,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(251,191,36,.05) 1px,transparent 1px); background-size:40px 40px; }
    .glass { background: rgba(20,20,20,.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="bg-ink-900 text-white antialiased">
  <!-- Navbar -->
  <nav class="sticky top-0 z-50 glass border-b border-amber-500/20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16">
        <a class="flex items-center gap-2 group">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center shadow-lg shadow-amber-500/30 group-hover:scale-110 transition-transform">
            <span class="font-display font-extrabold text-ink-900 text-lg">T</span>
          </div>
          <div class="flex flex-col leading-none">
            # logo 
            <span class="font-display font-bold text-amber-400 text-sm tracking-wide"></span>
            <span class="text-[10px] text-gray-500 font-medium"></span>
          </div>
        </a>
        <div class="hidden md:flex items-center gap-1">
          <a href="/" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-amber-300 hover:bg-amber-400/10 transition-all"><i data-lucide="home" class="w-4 h-4"></i></a>
          <a href="/lost" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-amber-300 hover:bg-amber-400/10 transition-all"><i data-lucide="search" class="w-4 h-4"></i></a>
          <a href="/found" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-amber-300 hover:bg-amber-400/10 transition-all"><i data-lucide="package-open" class="w-4 h-4"></i></a>
          <a href="/qr" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-amber-300 hover:bg-amber-400/10 transition-all"><i data-lucide="qr-code" class="w-4 h-4"></i></a>
        </div>

      </div>
    </div>
  </nav>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 items-center pointer-events-none">
        {% for category, message in messages %}
          <div class="animate-toast-in pointer-events-auto px-6 py-3 rounded-xl shadow-2xl font-semibold text-sm flex items-center gap-2
            {% if category == 'success' %}bg-found-500 text-white{% elif category == 'error' %}bg-lost-500 text-white{% else %}bg-amber-400 text-ink-900{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

</body>
</html>
