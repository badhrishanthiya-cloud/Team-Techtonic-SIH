<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Submission</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Success Card (Visible immediately) */
        .card {
            display: block; 
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* Animated Checkmark Container */
        .success-checkmark {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px auto;
        }

        /* The Checkmark SVG */
        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: block;
            stroke-width: 4;
            stroke: #2ecc71;
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #2ecc71;
            animation: fill .4s ease-in-out .4s forwards;
        }
        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 4;
            stroke-miterlimit: 10;
            stroke: #2ecc71;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }
        @keyframes fill {
            100% { box-shadow: inset 0px 0px 0px 40px #2ecc71; }
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin: 0 0 10px 0;
        }
        p {
            color: #7f8c8d;
            font-size: 16px;
            margin: 0 0 25px 0;
        }

        /* Redirect Button Styling */
        .redirect-btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
            transition: background 0.2s, transform 0.1s;
        }
        .redirect-btn:hover {
            background-color: #2980b9;
        }
        .redirect-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Success Card Container -->
    <div id="success-card" class="card">
        <div class="success-checkmark">
            <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="checkmark__check" fill="none" stroke="#fff" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>
        </div>
        <h1>Thank You!</h1>
        <p>Your response has been submitted</p>
        
        <!-- Redirect Button -->
        <a href="{ url_for("home_page") }"" class="redirect-btn">Go to Home Page</a>
    </div>

    <!-- Audio Element -->
    <audio id="success-sound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Attempt to play sound automatically on load
        window.addEventListener('DOMContentLoaded', () => {
            const sound = document.getElementById('success-sound');
            sound.play().catch(err => {
                console.log("Autoplay prevented by browser user-interaction policies:", err);
            });
        });
    </script>

</body>
</html>
